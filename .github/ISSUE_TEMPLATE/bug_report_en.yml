name: "Bug Report (English)"
description: Report a problem with the iLMeteo.it integration
body:
  - type: markdown
    attributes:
      value: |
        ## Before you continue

        Logs are essential — without them it is very hard to diagnose the problem. Please enable debug logging, reproduce the issue, and paste the relevant lines below.

        **Note:** attachments sent via email reply to a GitHub issue notification are automatically stripped and deleted by GitHub — they will not reach this issue. Please attach files directly on github.com instead.

  - type: checkboxes
    id: confirm-scope
    attributes:
      label: Confirm this issue belongs here
      options:
        - label: >-
            I am aware that giorgioparri is a grumpy maintainer, so it can happen that
            my issue will be closed quickly when essential information is missing
            (no logs, no description, no steps to reproduce, etc.).
          required: true
        - label: My Home Assistant version is up to date.
          required: true
        - label: >-
            I have checked, via HACS' 3-dot menu → "Update Information" on this
            integration, that I am running the **latest** released version.
          required: true
        - label: I have read the integration's README before opening this issue.
          required: true
        - label: >-
            I have checked existing issues (including closed ones) to make sure
            this isn't a duplicate.
          required: true
        - label: >-
            I confirm this is genuinely an issue with the integration (not just a
            question about how a feature works).
          required: true
        - label: |
            I confirm that I did not actually read any of the points above and just checked them all. |
            I didn't want to waste time on details, so I skipped reading or following any existing instructions. |
            Instead, I'd like giorgioparri to spend their free time explaining things to me — that's what open source is for, right? |
            I live by the motto: better to ask twice than think once. |
            It's giorgioparri's own fault for offering open-source software and free support.

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Found in Settings → Devices & Services → iLMeteo.it → three-dot menu → Integration information, or in CHANGELOG.md.
      placeholder: "e.g. 1.1.2"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Found in Settings → About.
      placeholder: "e.g. 2026.7.1"
    validations:
      required: true

  - type: dropdown
    id: ha_installation
    attributes:
      label: Home Assistant installation type
      options:
        - Home Assistant OS
        - Home Assistant Supervised
        - Home Assistant Container
        - Home Assistant Core
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly. What did you do, what did you expect, what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Enable debug logging first — add this to `configuration.yaml`, restart HA, reproduce the issue, then paste the relevant lines here.
        ```yaml
        logger:
          default: warning
          logs:
            custom_components.ilmeteo: debug
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: configuration
    attributes:
      label: Configuration
      description: Which optional features are enabled for the affected location?
      options:
        - label: Optional dedicated sensors (temperature, humidity, wind, etc.)
        - label: Weather alert notifications
        - label: DPC Alert entity (sensor.dpc_alert)
        - label: DPC Vigilance entity (sensor.dpc_vigilance)
        - label: Mobile push notifications (notify.mobile_app_*)

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might be relevant — automations, Lovelace cards, other integrations, etc.
    validations:
      required: false