name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install aiohttp
      - name: Run parser tests
        run: python tests/test_parser.py
      - name: Run alert tests
        run: python tests/test_alerts.py
      - name: Run API client tests
        run: python tests/test_api.py
      - name: Run condition mapping tests
        run: python tests/test_conditions.py
      - name: Run quota tests
        run: python tests/test_quota.py
      - name: Run update logic tests
        run: python tests/test_update.py
