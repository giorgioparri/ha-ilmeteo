name: "Feature Request (English)"
description: Suggest an idea for the iLMeteo.it integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you continue

        Please describe what you'd like to see and why — the more concrete the use case, the easier it is to evaluate.

  - type: checkboxes
    id: confirm-scope
    attributes:
      label: Confirm this request belongs here
      options:
        - label: >-
            I am aware that giorgioparri is a grumpy maintainer, so it can happen that
            my issue will be closed quickly when essential information is missing
            (no description, no use case, etc.).
          required: true
        - label: I have read the integration's README and this isn't already covered.
          required: true
        - label: >-
            I have checked existing issues (including closed ones) to make sure
            this isn't a duplicate request.
          required: true
        - label: |
            I confirm that I did not actually read any of the points above and just checked them all. |
            I didn't want to waste time on details, so I skipped reading or following any existing instructions. |
            Instead, I'd like giorgioparri to spend their free time explaining things to me — that's what open source is for, right? |
            I live by the motto: better to ask twice than think once. |
            It's giorgioparri's own fault for offering open-source software and free support.

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: What would you like to see, and why?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve for you? How would you use it?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, links to similar features elsewhere, etc.
    validations:
      required: false